<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>xmrfun</title>
<meta name="description" content="Launch private memecoins and collections on Monero.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="shell">
  <header class="top">
    <a class="brand" href="#/" aria-label="xmrfun home">xmr<span>fun</span></a>
    <button class="chip bal" id="bal" data-go="#/wallet" aria-label="Wallet balance">
      <i class="dot" id="syncdot"></i><span id="balv">—</span><small>XMR</small>
    </button>
  </header>
  <div class="ticker" aria-live="polite"><div class="ticker-track" id="ticker"></div></div>
  <main id="view" tabindex="-1"></main>
</div>

<nav class="tabs" aria-label="Main">
  <a href="#/feed" data-tab="feed"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><span>Explore</span></a>
  <a href="#/market" data-tab="market"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg><span>Market</span></a>
  <a href="#/launch" data-tab="launch" class="fab" aria-label="Launch"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></a>
  <a href="#/mine" data-tab="mine"><svg viewBox="0 0 24 24"><path d="M5 19 15 9m-3-5 8 8-3 3-8-8z"/></svg><span>Mine</span></a>
  <a href="#/wallet" data-tab="wallet"><svg viewBox="0 0 24 24"><path d="M3 7h15a3 3 0 0 1 3 3v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 7l12-3v3M16 13h2"/></svg><span>Wallet</span></a>
</nav>

<div class="sheet-scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></section>
<div class="toasts" id="toasts" aria-live="assertive"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<script type="module" src="/app.js"></script>
</body>
</html>

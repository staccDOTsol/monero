# {{NAME}} ({{TICKER}}) public seed node. From the chain/{{TICKER}} worktree root:
#   git submodule update --init --recursive      # build.sh already does this
#   fly apps create xmrfun-{{ticker}}-seed         # or change `app` below
#   fly volumes create chain_data --size 10 --region iad -a xmrfun-{{ticker}}-seed
#   fly ips allocate-v4 -a xmrfun-{{ticker}}-seed  # dedicated IPv4: raw-TCP p2p can't use the shared IP
#   fly deploy
# Then bake that IPv4 (or a DNS name with an A record) into the chain via mkchain.py --seed.
app = "xmrfun-{{ticker}}-seed"
primary_region = "iad"
kill_signal = "SIGINT"      # monerod flushes LMDB and exits cleanly on SIGINT
kill_timeout = "60s"

[build]
  dockerfile = "xmrfun/Dockerfile"

[env]
  DATA_DIR = "/data"
  P2P_PORT = "{{P2P_PORT}}"
  RPC_PORT = "{{RPC_PORT}}"

[[mounts]]
  source = "chain_data"
  destination = "/data"

# P2P: raw TCP straight to monerod.
[[services]]
  protocol = "tcp"
  internal_port = {{P2P_PORT}}
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[services.ports]]
    port = {{P2P_PORT}}

  [[services.tcp_checks]]
    grace_period = "60s"
    interval = "30s"
    timeout = "5s"

# Restricted RPC: HTTPS on 443 through Fly's proxy, and plain TCP on the chain's RPC port.
[[services]]
  protocol = "tcp"
  internal_port = {{RPC_PORT}}
  auto_stop_machines = "off"
  auto_start_machines = false

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.ports]]
    port = {{RPC_PORT}}

  [[services.http_checks]]
    grace_period = "120s"
    interval = "30s"
    method = "get"
    path = "/get_height"
    protocol = "http"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"

[[restart]]
  policy = "always"
